<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — SLIDESOL Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-checking" data-admin-checking>Checking access…</div>

  <div class="admin-login" data-admin-login hidden>
    <div class="admin-login__card">
      <p class="eyebrow">SLIDESOL Studio</p>
      <h1>Admin Sign In</h1>
      <form data-login-form novalidate>
        <div class="form-field"><label for="email">Email</label><input type="email" id="email" name="email" required autocomplete="username"></div>
        <div class="form-field"><label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
        <p class="admin-alert admin-alert--error" data-login-error hidden></p>
        <button type="submit" class="button-primary">Sign In</button>
      </form>
    </div>
  </div>

  <div class="admin-app" data-admin-app hidden>
    <aside class="admin-sidebar">
      <p class="admin-sidebar__logo">SLIDESOL <span>Studio</span></p>
      <nav class="admin-nav">
        <a href="index.html"><svg class="admin-nav__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a>
        <a href="products.html"><svg class="admin-nav__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20.59 13.41-7.17 7.17a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span>Products</span></a>
        <a href="brands.html"><svg class="admin-nav__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>Brands</span></a>
        <a href="orders.html" aria-current="page"><svg class="admin-nav__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Orders</span></a>
        <a href="customers.html"><svg class="admin-nav__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Customers</span></a>
      </nav>
      <div class="admin-sidebar__foot">
        <p data-admin-name></p>
        <button type="button" data-admin-signout>Sign Out</button>
        <a href="../index.html">← Back to site</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-page-head"><h1>Orders</h1></div>

      <p class="admin-alert admin-alert--error" data-admin-error hidden></p>
      <p class="admin-alert admin-alert--success" data-orders-filter-note hidden>Showing orders for one customer. <a href="orders.html">Clear filter</a></p>

      <div class="admin-card">
        <div class="admin-table-scroll">
          <table class="admin-table">
            <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th></tr></thead>
            <tbody data-orders-table></tbody>
          </table>
        </div>
        <p class="admin-empty" data-orders-empty hidden>No orders yet.</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAdmin } from '../js/admin/auth.js';
    import { initOrdersListPage } from '../js/admin/orders.js';

    requireAdmin(() => {
      initOrdersListPage();
    });
  </script>
</body>
</html>
