<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product | SLIDESOL Studio</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-shell"><aside class="admin-sidebar"><a class="wordmark" href="../index.html">SLIDESOL <span>STUDIO</span></a><nav><a href="index.html">Overview</a><a class="active" href="products.html">Products</a><a href="brands.html">Brands</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a></nav><button data-admin-logout class="logout-link" type="button">Sign out</button></aside><main class="admin-main"><a class="back-link" href="products.html">← Products</a><p class="eyebrow">Catalog</p><h1 id="product-form-heading">New product</h1><form class="product-form" id="product-core-form"><label>Name<input type="text" name="name" required placeholder="Product name"></label><label>Slug<input type="text" name="slug" placeholder="auto-generated"></label><label>Brand<select name="brand_id" required></select></label><label>Description<textarea name="description" rows="5" placeholder="Tell the story of this object"></textarea></label><label>Price (GHS)<input type="number" name="price" min="0" step="0.01" required></label><label class="checkbox-label"><input type="checkbox" name="is_active" checked>Active</label><button class="button button-dark" type="submit" id="product-save-button">Save and continue</button></form><p class="form-notice" data-product-notice role="alert"></p><div id="product-sections" hidden><section class="admin-panel"><div class="panel-heading"><h2>Colours</h2></div><form class="inline-form" id="colour-create-form"><label>Name<input type="text" name="name" required placeholder="e.g. Black"></label><label>Hex<input type="text" name="hex_code" placeholder="#111111"></label><button class="button button-dark" type="submit">Add colour</button></form><div class="chip-list" id="colour-list"></div></section><section class="admin-panel"><div class="panel-heading"><h2>Variants &amp; stock</h2></div><div id="variants-by-colour"></div></section><section class="admin-panel"><div class="panel-heading"><h2>Images</h2></div><div id="images-by-colour"></div></section></div></main><script type="module">import { requireAdmin } from '../js/admin/auth.js'; import { initProductForm } from '../js/admin/product-form.js'; requireAdmin(() => initProductForm());</script></body></html>
