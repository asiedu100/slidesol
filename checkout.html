<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | SLIDESOL</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">SLIDESOL</a>
    <a class="back-link" href="shop.html">Continue shopping</a>
    <span class="secure-note">Secure checkout next</span>
  </header>

  <main class="checkout-page">
    <div class="checkout-main">
      <p class="eyebrow">Checkout</p>
      <h1>Complete your order.</h1>

      <section class="cart-review" aria-label="Your bag">
        <h2 class="cart-review-heading">Your bag</h2>
        <div id="cart-lines"></div>
      </section>

      <form class="checkout-form" id="checkout-form" novalidate>
        <fieldset>
          <legend>Your details</legend>

          <label>
            Full name
            <input type="text" name="full_name" autocomplete="name" required>
          </label>

          <label>
            Phone
            <input type="tel" name="phone" autocomplete="tel" placeholder="024 000 0000" required>
          </label>

          <label>
            Email <span class="optional-tag">(optional)</span>
            <input type="email" name="email" autocomplete="email">
          </label>
        </fieldset>

        <fieldset>
          <legend>Fulfilment</legend>

          <div class="fulfilment-toggle" data-fulfilment-toggle>
            <label>
              <input type="radio" name="fulfilment_method" value="delivery" checked>
              Delivery
            </label>
            <label>
              <input type="radio" name="fulfilment_method" value="pickup">
              Pickup
            </label>
          </div>
        </fieldset>

        <fieldset data-delivery-fields>
          <legend>Delivery information</legend>

          <label>
            Region
            <select name="delivery_region" data-region-select required></select>
          </label>

          <label>
            City
            <input type="text" name="delivery_city" required>
          </label>

          <label>
            Area
            <input type="text" name="delivery_area" required>
          </label>

          <label>
            Delivery address
            <textarea name="delivery_address" rows="3" required></textarea>
          </label>
        </fieldset>

        <fieldset>
          <legend>Order note <span class="optional-tag">(optional)</span></legend>

          <textarea name="customer_note" rows="3" aria-label="Order note" placeholder="Anything we should know about your order?"></textarea>
        </fieldset>
      </form>
    </div>

    <aside class="summary" id="order-summary"></aside>
  </main>

  <script type="module" src="js/store/checkout.js"></script>
</body>
</html>
